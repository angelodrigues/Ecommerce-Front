name: Deploy Frontend

on:
  push:
    branches: [ prod ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Build do projeto React
        run: |
          npm install
          npm run build

      - name: Login no Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build da imagem Docker do frontend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:latest .

      - name: Push da imagem Docker
        run: docker push ${{ secrets.DOCKER_USERNAME }}/frontend:latest

      - name: Deploy na EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Parando e removendo container antigo (se existir)..."
            docker stop frontend || true
            docker rm -f frontend || true

            echo "Liberando porta 8888 se estiver travada..."
            fuser -k 8888/tcp || true

            echo "Removendo imagem antiga (opcional)..."
            docker image prune -f || true

            echo "Pull da nova imagem..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/frontend:latest

            echo "Subindo novo container na porta 8888..."
            docker run -d --name frontend -p 8888:80 ${{ secrets.DOCKER_USERNAME }}/frontend:latest
