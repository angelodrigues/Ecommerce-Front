name: Deploy Frontend

on:
  push:
    branches: [ prod ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Build do projeto React
        run: |
          npm install
          npm run build

      - name: Login no Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build da imagem Docker do frontend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:latest .

      - name: Push da imagem Docker com retry
        run: |
          for i in {1..3}; do
            echo "Tentativa $i de push..."
            docker --config ~/.docker push --max-concurrent-uploads=1 ${{ secrets.DOCKER_USERNAME }}/frontend:latest && break || sleep 15
          done

      - name: Deploy na EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Parando container existente (se houver)..."
            docker stop frontend || true
            sleep 2

            echo "Removendo container existente (se houver)..."
            docker rm frontend || true
            sleep 2

            echo "Removendo possíveis containers travados na porta 8888..."
            FRONTEND_ID=$(docker ps -aqf "name=frontend")
            if [ ! -z "$FRONTEND_ID" ]; then
              docker rm -f $FRONTEND_ID
            fi

            echo "Puxando imagem atualizada do frontend..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/frontend:latest

            echo "Subindo novo container do frontend..."
            docker run -d --name frontend -p 8888:80 ${{ secrets.DOCKER_USERNAME }}/frontend:latest
